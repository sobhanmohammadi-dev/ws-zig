name: Feature request
description: Suggest a capability or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This project deliberately implements only what the Whitespace v0.3
        reference implements. Features that change language behaviour are
        unlikely to be accepted; performance, size, diagnostics, tooling and
        portability improvements are welcome.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and what would it affect?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including doing nothing.
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This does not require new dependencies.
        - label: This does not change Whitespace language behaviour.
        - label: I have read docs/compatibility.md.
