name: Bug report
description: Report incorrect behaviour, a compatibility difference, or a crash
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Behaviour that differs from the Haskell reference
        is a bug even if the reference itself looks wrong — please say which
        behaviour you expected and why.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed output, exit status and stderr.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Include the reference interpreter's result if you have it.
    validations:
      required: true
  - type: textarea
    id: program
    attributes:
      label: Program and input
      description: |
        Paste the Whitespace program if it is small, or attach it. If you can,
        rewrite it as a readable fixture using the mnemonics from tests/assemble.py.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and build mode
      description: Release tag or commit, Zig version, and build mode (ReleaseSmall, ReleaseSafe, ...).
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux x86_64
        - Other Linux
        - Not listed
    validations:
      required: true
