name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows
          - aarch64-windows
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Zig 0.17.0
        run: |
          curl -sSL -o zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          tar xf zig.tar.xz
          rm zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"

      - name: Build
        run: zig build -Doptimize=ReleaseSmall -Dtarget=${{ matrix.target }} --prefix dist/${{ matrix.target }}

      - name: Package
        run: |
          name="wspace-${{ matrix.target }}"
          mkdir -p "$name"
          cp -r "dist/${{ matrix.target }}/bin/." "$name/"
          cp README.md LICENSE "$name/"
          if [ -f "$name/wspace.exe" ]; then
            zip -q -r "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wspace-${{ matrix.target }}
          path: |
            wspace-*.tar.gz
            wspace-*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Collect archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --title "$GITHUB_REF_NAME"
