name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Zig 0.17.0
        run: |
          curl -sSL -o zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          tar xf zig.tar.xz
          rm zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: zig version

      - name: Check formatting
        run: zig fmt --check build.zig src

      - name: Unit tests
        run: zig build test

      - name: Release build
        run: zig build -Doptimize=ReleaseSmall

      - name: Conformance suite
        run: ./tests/run.sh check

      - name: Report binary size
        run: |
          stat -c '%s bytes' zig-out/bin/wspace
          file zig-out/bin/wspace
